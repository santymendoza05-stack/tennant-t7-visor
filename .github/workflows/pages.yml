# Publica el visor en GitHub Pages en cada push a main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Falla si el bloque FALLBACK de js/app.js no coincide con los JSON de data/
      - name: Verificar que el respaldo FALLBACK esté sincronizado
        run: |
          node tools/sync-fallback.js
          git diff --exit-code js/app.js || {
            echo "::error::js/app.js no está sincronizado con data/. Ejecuta 'node tools/sync-fallback.js' y vuelve a subir los cambios."
            exit 1
          }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
